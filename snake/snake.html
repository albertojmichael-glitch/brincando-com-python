<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Snake em Lua - Gráficos Google</title>
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
    <style>
        body {
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #a2d149;
            color: #111;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 0 #87b03b;
            transition: transform 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        #score {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        canvas {
            /* Removemos a cor de fundo daqui, o Lua vai desenhar o xadrez */
            border-radius: 8px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            outline: none;
        }
    </style>
</head>
<body>

    <button id="btn-start">Jogar Snake (Remastered)</button>
    <div id="score">Pontos: 0</div>
    
    <canvas id="game-canvas" width="400" height="400" tabindex="0"></canvas>

    <!-- PONTE JAVASCRIPT -->
    <script>
        window.teclaPressionada = "";
        window.addEventListener("keydown", function(e) {
            const teclasValidas = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"];
            if(teclasValidas.includes(e.key)) {
                e.preventDefault();
                window.teclaPressionada = e.key.toLowerCase();
            }
        });
    </script>

    <!-- LÓGICA DO JOGO EM LUA -->
    <script type="application/lua">
        local js = require "js"
        local document = js.global.document
        local window = js.global
        local math = math

        local grid_size = 20
        local tile_size = 20
        
        local snake = {}
        local dx, dy = 1, 0
        local food = {x = 0, y = 0}
        local score = 0
        local game_over = false
        local interval_id = nil

        local canvas = document:getElementById("game-canvas")
        local ctx = canvas:getContext("2d")
        local score_el = document:getElementById("score")
        local btn_start = document:getElementById("btn-start")

        local function spawn_food()
            local valid = false
            while not valid do
                food.x = math.random(1, grid_size)
                food.y = math.random(1, grid_size)
                valid = true
                for i = 1, #snake do
                    if snake[i].x == food.x and snake[i].y == food.y then
                        valid = false
                        break
                    end
                end
            end
        end

        local function update()
            if game_over then return end

            local key = tostring(window.teclaPressionada)
            window.teclaPressionada = "" 

            -- Impede que a cobra "dê ré" no próprio corpo
            if (key == "w" or key == "arrowup") and dy == 0 then
                dx, dy = 0, -1
            elseif (key == "s" or key == "arrowdown") and dy == 0 then
                dx, dy = 0, 1
            elseif (key == "a" or key == "arrowleft") and dx == 0 then
                dx, dy = -1, 0
            elseif (key == "d" or key == "arrowright") and dx == 0 then
                dx, dy = 1, 0
            end

            local head = snake[1]
            local new_x = head.x + dx
            local new_y = head.y + dy

            -- Atravessar paredes
            if new_x < 1 then new_x = grid_size end
            if new_x > grid_size then new_x = 1 end
            if new_y < 1 then new_y = grid_size end
            if new_y > grid_size then new_y = 1 end

            -- Colisão
            for i = 1, #snake do
                if snake[i].x == new_x and snake[i].y == new_y then
                    game_over = true
                    return
                end
            end

            table.insert(snake, 1, {x = new_x, y = new_y})

            if new_x == food.x and new_y == food.y then
                score = score + 10
                score_el.innerText = "Pontos: " .. tostring(score)
                spawn_food()
            else
                table.remove(snake)
            end
        end

        local function render()
            -- 1. DESENHAR FUNDO XADREZ (Verde claro e escuro)
            for y = 1, grid_size do
                for x = 1, grid_size do
                    if (x + y) % 2 == 0 then
                        ctx.fillStyle = "#aad751" -- Verde claro
                    else
                        ctx.fillStyle = "#a2d149" -- Verde escuro
                    end
                    ctx:fillRect((x - 1) * tile_size, (y - 1) * tile_size, tile_size, tile_size)
                end
            end

            if game_over then
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)"
                ctx:fillRect(0, 0, canvas.width, canvas.height)
                ctx.fillStyle = "#fff"
                ctx.font = "bold 35px sans-serif"
                ctx.textAlign = "center"
                ctx:fillText("GAME OVER", canvas.width / 2, canvas.height / 2)
                ctx.font = "16px sans-serif"
                ctx:fillText("Recarregue a página", canvas.width / 2, (canvas.height / 2) + 30)
                return
            end

            -- Configurar sombra global para a maçã e a cobra
            ctx.shadowColor = "rgba(0, 0, 0, 0.3)"
            ctx.shadowBlur = 4
            ctx.shadowOffsetY = 3

            -- 2. DESENHAR A MAÇÃ (Vermelha redondinha)
            local cx = (food.x - 1) * tile_size + (tile_size / 2)
            local cy = (food.y - 1) * tile_size + (tile_size / 2)
            
            ctx.fillStyle = "#e7471d"
            ctx:beginPath()
            ctx:arc(cx, cy, tile_size / 2.2, 0, 2 * math.pi)
            ctx:fill()

            -- 3. DESENHAR A COBRA (Linha contínua azul)
            -- O truque para uma cobra orgânica é desenhar uma linha grossa com as pontas arredondadas!
            ctx.strokeStyle = "#4b7cf6" -- Azul Google Snake
            ctx.lineWidth = tile_size * 0.8
            ctx.lineCap = "round"
            ctx.lineJoin = "round"
            
            ctx:beginPath()
            ctx:moveTo((snake[1].x - 1) * tile_size + (tile_size/2), (snake[1].y - 1) * tile_size + (tile_size/2))
            
            for i = 2, #snake do
                local cur = snake[i]
                local prev = snake[i-1]
                -- Se a distância entre um gomo e outro for maior que 1, ela atravessou a tela. 
                -- Interrompemos o desenho da linha para não cruzar o mapa inteiro.
                if math.abs(cur.x - prev.x) > 1 or math.abs(cur.y - prev.y) > 1 then
                    ctx:stroke()
                    ctx:beginPath()
                    ctx:moveTo((cur.x - 1) * tile_size + (tile_size/2), (cur.y - 1) * tile_size + (tile_size/2))
                else
                    ctx:lineTo((cur.x - 1) * tile_size + (tile_size/2), (cur.y - 1) * tile_size + (tile_size/2))
                end
            end
            ctx:stroke()

            -- Remover sombras para não aplicar nos olhos
            ctx.shadowColor = "transparent"

            -- 4. DESENHAR OS OLHOS
            local hx = (snake[1].x - 1) * tile_size + (tile_size/2)
            local hy = (snake[1].y - 1) * tile_size + (tile_size/2)
            local ex1, ey1, ex2, ey2 = 0, 0, 0, 0

            -- Posição dos olhos baseada na direção da cobra
            if dx == 1 then -- Indo pra Direita
                ex1, ey1 = 3, -4; ex2, ey2 = 3, 4
            elseif dx == -1 then -- Indo pra Esquerda
                ex1, ey1 = -3, -4; ex2, ey2 = -3, 4
            elseif dy == 1 then -- Indo pra Baixo
                ex1, ey1 = -4, 3; ex2, ey2 = 4, 3
            elseif dy == -1 then -- Indo pra Cima
                ex1, ey1 = -4, -3; ex2, ey2 = 4, -3
            end

            -- Branco do olho
            ctx.fillStyle = "#fff"
            ctx:beginPath(); ctx:arc(hx + ex1, hy + ey1, 3.5, 0, 2*math.pi); ctx:fill()
            ctx:beginPath(); ctx:arc(hx + ex2, hy + ey2, 3.5, 0, 2*math.pi); ctx:fill()

            -- Pupila preta (deslocada levemente na direção do movimento para ela "olhar" pra frente)
            ctx.fillStyle = "#111"
            ctx:beginPath(); ctx:arc(hx + ex1 + (dx*1.5), hy + ey1 + (dy*1.5), 1.8, 0, 2*math.pi); ctx:fill()
            ctx:beginPath(); ctx:arc(hx + ex2 + (dx*1.5), hy + ey2 + (dy*1.5), 1.8, 0, 2*math.pi); ctx:fill()
        end

        btn_start:addEventListener("click", function()
            btn_start.style.display = "none"
            canvas.style.display = "block"
            canvas:focus()
            
            snake = { 
                {x = 10, y = 10},
                {x = 9, y = 10},
                {x = 8, y = 10}
            }
            dx, dy = 1, 0
            score = 0
            game_over = false
            math.randomseed(os.time())
            spawn_food()

            if interval_id then window:clearInterval(interval_id) end
            
            interval_id = window:setInterval(function()
                update()
                render()
            end, 120) -- Ajustei para 120ms (velocidade confortável)
        end)
    </script>
</body>
</html>
