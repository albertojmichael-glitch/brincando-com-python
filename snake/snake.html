<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ASCII Snake em Lua</title>
    <!-- Importa o interpretador Lua (Fengari) -->
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
    <style>
        body {
            background-color: #001f3f;
            color: #7FDBFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #7FDBFF;
            color: #001f3f;
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button:hover { background: #fff; }
        button:disabled { background: #555; color: #222; cursor: not-allowed; }
        #score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #game-screen {
            font-size: 18px;
            line-height: 1;
            display: none;
        }
    </style>
</head>
<body>

    <button id="btn-start">Jogar Snake</button>
    <div id="score">Pontos: 0</div>
    <pre id="game-screen"></pre>

    <script type="application/lua">
        local js = require "js"
        local window = js.global
        local document = window.document

        -- Configurações do Jogo
        local width = 40
        local height = 20
        local snake = {}
        local dx, dy = 1, 0
        local food = {x = 0, y = 0}
        local score = 0
        local game_over = false
        local interval_id = nil

        -- Elementos da Tela
        local game_screen = document:getElementById("game-screen")
        local score_el = document:getElementById("score")
        local btn_start = document:getElementById("btn-start")

        -- Função para gerar a comida em local vazio
        local function spawn_food()
            local valid = false
            while not valid do
                food.x = math.random(2, width - 1)
                food.y = math.random(2, height - 1)
                valid = true
                for i = 1, #snake do
                    if snake[i].x == food.x and snake[i].y == food.y then
                        valid = false
                        break
                    end
                end
            end
        end

        -- Lógica de atualização
        local function update()
            if game_over then return end

            -- Calcula a nova posição da cabeça
            local head = snake[1]
            local new_x = head.x + dx
            local new_y = head.y + dy

            -- Colisão com as paredes
            if new_x <= 1 or new_x >= width or new_y <= 1 or new_y >= height then
                game_over = true
                return
            end

            -- Colisão consigo mesmo
            for i = 1, #snake do
                if snake[i].x == new_x and snake[i].y == new_y then
                    game_over = true
                    return
                end
            end

            -- Move a cobra (insere nova cabeça)
            table.insert(snake, 1, {x = new_x, y = new_y})

            -- Verifica se comeu
            if new_x == food.x and new_y == food.y then
                score = score + 10
                score_el.innerText = "Pontos: " .. tostring(score)
                spawn_food()
            else
                -- Remove a ponta da cauda se não comeu
                table.remove(snake)
            end
        end

        -- Renderização ASCII
        local function render()
            local output = ""
            for y = 1, height do
                for x = 1, width do
                    local char = " "
                    
                    -- Bordas
                    if y == 1 or y == height then
                        char = "-"
                    elseif x == 1 or x == width then
                        char = "|"
                    end

                    -- Comida
                    if x == food.x and y == food.y then
                        char = "*"
                    end

                    -- Cobra
                    for i = 1, #snake do
                        if snake[i].x == x and snake[i].y == y then
                            if i == 1 then
                                char = "O" -- Cabeça
                            else
                                char = "o" -- Corpo
                            end
                        end
                    end

                    output = output .. char
                end
                output = output .. "\n"
            end
            
            if game_over then
                output = output .. "\n      GAME OVER! Recarregue a página."
            end
            
            game_screen.innerText = output
        end

        -- Controles do teclado
        window:addEventListener("keydown", function(e)
            local key = tostring(e.key):lower()
            -- Evita que a cobra dê ré (não pode virar 180 graus de uma vez)
            if (key == "w" or key == "arrowup") and dy == 0 then
                dx, dy = 0, -1
            elseif (key == "s" or key == "arrowdown") and dy == 0 then
                dx, dy = 0, 1
            elseif (key == "a" or key == "arrowleft") and dx == 0 then
                dx, dy = -1, 0
            elseif (key == "d" or key == "arrowright") and dx == 0 then
                dx, dy = 1, 0
            end
        end)

        -- Inicialização
        btn_start:addEventListener("click", function()
            btn_start.style.display = "none"
            game_screen.style.display = "block"
            
            -- Reseta o jogo
            snake = { {x = math.floor(width/2), y = math.floor(height/2)} }
            dx, dy = 1, 0
            score = 0
            game_over = false
            math.randomseed(os.time())
            spawn_food()

            if interval_id then window:clearInterval(interval_id) end
            
            -- Loop do jogo rodando a 80ms
            interval_id = window:setInterval(function()
                update()
                render()
            end, 80)
        end)
    </script>
</body>
</html>
