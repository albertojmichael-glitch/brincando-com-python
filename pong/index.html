<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ASCII Pong - Ultimate Edition</title>
    <!-- Importa o interpretador de Ruby (WebAssembly) -->
    <script src="https://cdn.jsdelivr.net/npm/ruby-3_2-wasm-wasi@2.1.0/dist/browser.script.iife.js"></script>
    <style>
        body {
            background-color: #001f3f;
            color: #7FDBFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        .menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #7FDBFF;
            color: #001f3f;
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #fff; }
        #game-screen {
            font-size: 18px;
            line-height: 1;
            display: none;
        }
    </style>
</head>
<body>

    <div class="menu" id="menu">
        <button id="btn-facil">Fácil</button>
        <button id="btn-normal">Normal</button>
        <button id="btn-hospicio">Hospício</button>
    </div>
    <pre id="game-screen"></pre>

    <!-- Carrega o arquivo Ruby externo -->
    <script type="text/ruby" src="pong.rb"></script>
</body>
</html>
