<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong - Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/ruby-3_2-wasm-wasi@2.1.0/dist/browser.script.iife.js"></script>
    <style>
        body {
            background-color: #001f3f;
            color: #7FDBFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        .menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #7FDBFF;
            color: #001f3f;
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #fff; }
        button:disabled { background: #555; color: #222; cursor: not-allowed; }
        #score {
            font-family: monospace;
            margin-bottom: 8px;
            color: #7FDBFF;
            font-size: 24px;
            font-weight: bold;
        }
        #game-screen {
            font-family: monospace;
            font-size: 18px;
            line-height: 1;
            display: none;
        }
    </style>
</head>
<body>

    <div class="menu" id="menu">
        <button id="btn-facil">1P: Fácil</button>
        <button id="btn-normal">1P: Normal</button>
        <button id="btn-hospicio">1P: Hospício</button>
        <button id="btn-2p">2 Players</button>
    </div>

    <div id="score"></div>
    <pre id="game-screen"></pre>

    <script type="text/ruby">
        require 'js'

        class ASCIIPong
          attr_accessor :width, :height, :paddle_left, :paddle_right, :score_left, :score_right, :difficulty, :right_human
          
          def initialize
            @width = 50
            @height = 20
            @paddle_left = @height / 2
            @paddle_right = @height / 2
            @score_left = 0
            @score_right = 0
            @difficulty = :normal
            @right_human = false
            
            @keys = { "w" => false, "s" => false, "arrowup" => false, "arrowdown" => false }
            reset_ball
          end

          def update_keys(key, is_pressed)
            @keys[key] = is_pressed if @keys.key?(key)
          end

          def reset_ball
            @ball_x = @width / 2
            @ball_y = @height / 2
            @ball_dx = [1, -1].sample
            @ball_dy = [1, -1].sample
          end

          def update
            # 1. Movimento dos Jogadores
            @paddle_left -= 1 if @keys["w"] && @paddle_left > 1
            @paddle_left += 1 if @keys["s"] && @paddle_left < @height - 2

            if @right_human
              @paddle_right -= 1 if @keys["arrowup"] && @paddle_right > 1
              @paddle_right += 1 if @keys["arrowdown"] && @paddle_right < @height - 2
            else
              chance_de_agir = case @difficulty
                               when :facil then 0.25
                               when :normal then 0.60
                               when :hospicio then 0.95
                               else 0.60
                               end

              if rand <= chance_de_agir
                if @ball_y > @paddle_right && @paddle_right < @height - 2
                  @paddle_right += 1
                elsif @ball_y < @paddle_right && @paddle_right > 1
                  @paddle_right -= 1
                end
              end
            end

            # 2. Movimento da Bola (agora flui naturalmente a cada frame)
            next_x = @ball_x + @ball_dx
            next_y = @ball_y + @ball_dy

            if next_y <= 0 || next_y >= @height - 1
              @ball_dy *= -1
              next_y = @ball_y + @ball_dy 
            end

            if next_x == 1 && next_y.between?(@paddle_left - 1, @paddle_left + 1)
              @ball_dx *= -1
              next_x = 2 
            elsif next_x == @width - 2 && next_y.between?(@paddle_right - 1, @paddle_right + 1)
              @ball_dx *= -1
              next_x = @width - 3 
            end

            @ball_x = next_x
            @ball_y = next_y

            # 3. Pontuação
            if @ball_x < 0
              @score_right += 1
              reset_ball
            elsif @ball_x >= @width
              @score_left += 1
              reset_ball
            end
          end

          def render
            screen = Array.new(@height) { Array.new(@width, ' ') }

            @height.times do |y|
              @width.times do |x|
                if y == 0 || y == @height - 1
                  screen[y][x] = '-'
                elsif x == @width / 2 && y.even?
                  screen[y][x] = '|'
                end
              end
            end

            (-1..1).each do |dy|
              screen[@paddle_left + dy][1] = ']' if (@paddle_left + dy).between?(0, @height-1)
              screen[@paddle_right + dy][@width-2] = '[' if (@paddle_right + dy).between?(0, @height-1)
            end

            screen[@ball_y][@ball_x] = 'O' if @ball_y.between?(0, @height-1) && @ball_x.between?(0, @width-1)
            screen.map(&:join).join("\n")
          end
        end

        document = JS.global[:document]
        menu = document.getElementById("menu")
        game_screen = document.getElementById("game-screen")
        score_el = document.getElementById("score")

        game = ASCIIPong.new

        $pong_paused = false
        $pong_interval_id = nil

        JS.global.addEventListener("keydown") do |event|
          key = event[:key].to_s.downcase
          if key == "p"
            $pong_paused = !$pong_paused
          else
            game.update_keys(key, true)
          end
        end

        JS.global.addEventListener("keyup") do |event|
          key = event[:key].to_s.downcase
          game.update_keys(key, false) unless key == "p"
        end

        def start_game(game, document, menu, game_screen, score_el, diff, right_human: false)
          JS.global.clearInterval($pong_interval_id) if $pong_interval_id

          game.difficulty = diff
          game.right_human = right_human
          game.score_left = 0
          game.score_right = 0
          $pong_paused = false

          document.querySelectorAll("button").forEach do |btn| 
            btn[:disabled] = true 
          end
          menu[:style][:display] = "none"
          game_screen[:style][:display] = "block"

          # Ajustado para 40ms (25 atualizações por segundo). Fim da câmera lenta!
          interval_id = JS.global.setInterval(-> {
            if $pong_paused
              score_el[:innerText] = "[PAUSED] Player: #{game.score_left}    #{game.right_human ? 'P2' : 'CPU'}: #{game.score_right}"
            else
              game.update
              score_el[:innerText] = "Player: #{game.score_left}    #{game.right_human ? 'P2' : 'CPU'}: #{game.score_right}"
              game_screen[:innerText] = game.render
            end
          }, 40)

          $pong_interval_id = interval_id
        end

        document.getElementById("btn-facil").addEventListener("click") { start_game(game, document, menu, game_screen, score_el, :facil) }
        document.getElementById("btn-normal").addEventListener("click") { start_game(game, document, menu, game_screen, score_el, :normal) }
        document.getElementById("btn-hospicio").addEventListener("click") { start_game(game, document, menu, game_screen, score_el, :hospicio) }
        document.getElementById("btn-2p").addEventListener("click") { start_game(game, document, menu, game_screen, score_el, :normal, right_human: true) }
    </script>
</body>
</html>
