<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ASCII Pong em Ruby</title>
    <!-- Importa o interpretador de Ruby para o navegador (WebAssembly) -->
    <script src="https://cdn.jsdelivr.net/npm/ruby-3_2-wasm-wasi@2.1.0/dist/browser.script.iife.js"></script>
    <style>
        body {
            background-color: #111;
            color: #0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        #play-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #0f0;
            color: #111;
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        #play-btn:hover { background: #fff; }
        #game-screen {
            font-size: 18px;
            line-height: 1;
            display: none; /* Escondido até clicar em Play */
        }
    </style>
</head>
<body>

    <button id="play-btn">PLAY PONG</button>
    <pre id="game-screen"></pre>

    <!-- Aqui começa o seu código puro em Ruby -->
    <script type="text/ruby">
        require 'js'

        class ASCII_Pong
          attr_accessor :width, :height, :ball_x, :ball_y, :paddle_left, :paddle_right

          def initialize
            @width = 40
            @height = 15
            @ball_x = @width / 2
            @ball_y = @height / 2
            @ball_dx = 1
            @ball_dy = 1
            @paddle_left = @height / 2
            @paddle_right = @height / 2
          end

          def update
            @ball_x += @ball_dx
            @ball_y += @ball_dy

            # Rebater no teto e no chão
            if @ball_y <= 0 || @ball_y >= @height - 1
              @ball_dy *= -1
            end

            # Rebater nas raquetes
            if @ball_x == 1 && (@ball_y - @paddle_left).abs <= 1
              @ball_dx *= -1
            elsif @ball_x == @width - 2 && (@ball_y - @paddle_right).abs <= 1
              @ball_dx *= -1
            end

            # Ponto marcado (reset da bola)
            if @ball_x < 0 || @ball_x >= @width
              @ball_x = @width / 2
              @ball_y = @height / 2
            end
          end

          def render
            screen = Array.new(@height) { Array.new(@width, ' ') }

            # Desenhar bordas
            @width.times do |x| 
              screen[0][x] = '-'
              screen[@height-1][x] = '-'
            end

            # Desenhar raquetes (tamanho 3)
            (-1..1).each do |dy|
              screen[@paddle_left + dy][0] = ']' if (@paddle_left + dy).between?(0, @height-1)
              screen[@paddle_right + dy][@width-1] = '[' if (@paddle_right + dy).between?(0, @height-1)
            end

            # Desenhar a bola
            screen[@ball_y][@ball_x] = 'O' if @ball_y.between?(0, @height-1) && @ball_x.between?(0, @width-1)

            screen.map(&:join).join("\n")
          end
        end

        # Instancia o jogo
        game = ASCII_Pong.new

        # Pegar os elementos do DOM usando a ponte JS do Ruby
        document = JS.global[:document]
        play_btn = document.getElementById("play-btn")
        game_screen = document.getElementById("game-screen")

        # Configurar os controles do teclado
        JS.global.addEventListener("keydown") do |event|
          key = event[:key].to_s
          case key
          when "w" then game.paddle_left -= 1 if game.paddle_left > 1
          when "s" then game.paddle_left += 1 if game.paddle_left < game.height - 2
          when "ArrowUp" then game.paddle_right -= 1 if game.paddle_right > 1
          when "ArrowDown" then game.paddle_right += 1 if game.paddle_right < game.height - 2
          end
        end

        # Ação do botão PLAY
        play_btn.addEventListener("click") do
          play_btn[:style][:display] = "none"
          game_screen[:style][:display] = "block"

          # Loop do jogo rodando a 10 quadros por segundo (100ms)
          JS.global.setInterval(-> {
            game.update
            game_screen[:innerText] = game.render
          }, 100)
        end
    </script>
</body>
</html>
