<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ASCII Pong - Single Player</title>
    <!-- Importa o interpretador de Ruby para o navegador -->
    <script src="https://cdn.jsdelivr.net/npm/ruby-3_2-wasm-wasi@2.1.0/dist/browser.script.iife.js"></script>
    <style>
        body {
            background-color: #001f3f; /* Azul escuro inspirado na imagem */
            color: #7FDBFF; /* Azul claro para o contraste */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        #play-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #7FDBFF;
            color: #001f3f;
            border: none;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        #play-btn:hover { background: #fff; }
        #game-screen {
            font-size: 18px;
            line-height: 1;
            display: none;
        }
    </style>
</head>
<body>

    <button id="play-btn">PLAY PONG (vs IA)</button>
    <pre id="game-screen"></pre>

    <script type="text/ruby">
        require 'js'

        class ASCII_Pong
          attr_accessor :width, :height, :ball_x, :ball_y, :paddle_left, :paddle_right, :score_left, :score_right

          def initialize
            @width = 50
            @height = 20
            @ball_x = @width / 2
            @ball_y = @height / 2
            @ball_dx = 1
            @ball_dy = 1
            @paddle_left = @height / 2
            @paddle_right = @height / 2
            @score_left = 0
            @score_right = 0
          end

          def update
            # --- Lógica da IA (Raquete da Direita) ---
            # A IA persegue a bola, mas com uma leve chance de errar/atrasar
            if @ball_y > @paddle_right && rand > 0.25
              @paddle_right += 1
            elsif @ball_y < @paddle_right && rand > 0.25
              @paddle_right -= 1
            end

            # Limitar a raquete da IA para não sair da tela
            @paddle_right = 1 if @paddle_right < 1
            @paddle_right = @height - 2 if @paddle_right > @height - 2

            # --- Movimento da Bola ---
            @ball_x += @ball_dx
            @ball_y += @ball_dy

            # Rebater no teto e no chão
            if @ball_y <= 0 || @ball_y >= @height - 1
              @ball_dy *= -1
            end

            # Rebater nas raquetes
            if @ball_x <= 2 && (@ball_y - @paddle_left).abs <= 1
              @ball_dx *= -1
              @ball_x = 3 # Evita que a bola fique presa
            elsif @ball_x >= @width - 3 && (@ball_y - @paddle_right).abs <= 1
              @ball_dx *= -1
              @ball_x = @width - 4
            end

            # --- Regras de Pontuação ---
            if @ball_x < 0
              @score_right += 1
              reset_ball
            elsif @ball_x >= @width
              @score_left += 1
              reset_ball
            end
          end

          def reset_ball
            @ball_x = @width / 2
            @ball_y = @height / 2
            # Quem tomou o ponto começa recebendo a bola
            @ball_dx *= -1 
          end

          def render
            screen = Array.new(@height) { Array.new(@width, ' ') }

            # 1. Desenhar o teto, o chão e a linha central tracejada
            @height.times do |y|
              @width.times do |x|
                if y == 0 || y == @height - 1
                  screen[y][x] = '-'
                elsif x == @width / 2 && y % 2 == 0 # Alterna linhas para fazer o tracejado
                  screen[y][x] = '|'
                end
              end
            end

            # 2. Inserir o placar no topo da tela (semelhante à imagem)
            screen[2][@width / 4] = @score_left.to_s
            screen[2][3 * @width / 4] = @score_right.to_s

            # 3. Desenhar raquetes
            (-1..1).each do |dy|
              screen[@paddle_left + dy][1] = ']' if (@paddle_left + dy).between?(0, @height-1)
              screen[@paddle_right + dy][@width-2] = '[' if (@paddle_right + dy).between?(0, @height-1)
            end

            # 4. Desenhar a bola
            screen[@ball_y][@ball_x] = 'O' if @ball_y.between?(0, @height-1) && @ball_x.between?(0, @width-1)

            screen.map(&:join).join("\n")
          end
        end

        game = ASCII_Pong.new
        document = JS.global[:document]
        play_btn = document.getElementById("play-btn")
        game_screen = document.getElementById("game-screen")

        # Controles para o Player 1 (W e S)
        JS.global.addEventListener("keydown") do |event|
          key = event[:key].to_s
          case key
          when "w", "W" then game.paddle_left -= 1 if game.paddle_left > 1
          when "s", "S" then game.paddle_left += 1 if game.paddle_left < game.height - 2
          end
        end

        play_btn.addEventListener("click") do
          play_btn[:style][:display] = "none"
          game_screen[:style][:display] = "block"

          JS.global.setInterval(-> {
            game.update
            game_screen[:innerText] = game.render
          }, 80) # Diminuí o tempo para 80ms para o jogo ficar um pouco mais rápido
        end
    </script>
</body>
</html>
